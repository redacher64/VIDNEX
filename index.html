      (function () {
        try {
          var path = window.location.pathname || '';
          var search = window.location.search || '';
          if (path === '/admin' || path.indexOf('/admin/') === 0 || search.indexOf('admin=1') !== -1) {
            var savedAdminTheme = null;
            try {
              savedAdminTheme = window.localStorage.getItem('vidnex_admin_theme');
            } catch (_e) {}
            var initialAdminTheme =
              savedAdminTheme === 'dark' || savedAdminTheme === 'light'
                ? savedAdminTheme
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
            var rootEl = document.documentElement;
            rootEl.classList.remove('light', 'dark');
            rootEl.classList.add(initialAdminTheme);
            rootEl.setAttribute('data-admin-theme', initialAdminTheme);
          }
        } catch (_themeErr) {}

        try {
          var currentFetch =
            typeof window.fetch === 'function'
              ? window.fetch.bind(window)
              : undefined;

          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (target, prop, attributes) {
            if (
              (target === window || target === Window.prototype) &&
              prop === 'fetch' &&
              attributes &&
              typeof attributes.get === 'function' &&
              typeof attributes.set !== 'function'
            ) {
              var customVal = undefined;
              var origGet = attributes.get;
              return origDefineProperty.call(Object, target, prop, {
                configurable: true,
                enumerable: attributes.enumerable !== false,
                get: function () {
                  return customVal !== undefined
                    ? customVal
                    : origGet.call(this);
                },
                set: function (v) {
                  if (typeof v === 'function') {
                    customVal = v;
                  }
                },
              });
            }
            return origDefineProperty.call(Object, target, prop, attributes);
          };

          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            typeof Window !== 'undefined'
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : undefined;

          if (protoDesc && protoDesc.configurable !== false && !protoDesc.writable && !protoDesc.set) {
            origDefineProperty.call(Object, Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }

          if (!winDesc || winDesc.configurable !== false) {
            origDefineProperty.call(Object, window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_err) {
          // Ignore if descriptor is locked by host environment
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
