            typeof window.fetch === 'function'
              ? window.fetch.bind(window)
              : undefined;

          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (target, prop, attributes) {
            if (
              (target === window || target === Window.prototype) &&

              return origDefineProperty.call(Object, target, prop, {
                configurable: true,
                enumerable: attributes.enumerable !== false,
                get: function () {

                    ? customVal
                    : origGet.call(this);
                },
                set: function (v) {
                  if (typeof v === 'function') {
                    customVal = v;
                  }
                },
              });
            }
            return origDefineProperty.call(Object, target, prop, attributes);
          };

          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            typeof Window !== 'undefined'
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : undefined;

          if (protoDesc && protoDesc.configurable !== false && !protoDesc.writable && !protoDesc.set) {

              configurable: true,

              },

                }
              },
            });
          }

          if (!winDesc || winDesc.configurable !== false) {
            origDefineProperty.call(Object, window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_err) {
          // Ignore if descriptor is locked by host environment
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') !== -1
            ) {
